name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  actions: read
  contents: read
  pull-requests: read

# Um run por referência. O push seguinte ao mesmo PR cancela o anterior, que já não
# descreve o que será integrado: sem isto, uma sequência de correções de revisão deixou
# SEIS runs da mesma branch vivos ao mesmo tempo, cada um carregando as quatro suítes de
# e2e com Keycloak, e todos disputando os mesmos runners — o gate passou de 20 minutos
# para quase três horas sem que o código tivesse mudado de tamanho.
#
# Em `main` é o contrário: cada commit integrado precisa da própria validação, e cancelar
# a anterior deixaria buraco no histórico de verificação. Daí a condição no valor.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  adr-lint:
    name: ADR lint (MADR 4.0)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Validar ADRs (MADR 4.0)
        run: bash tools/adr-lint/validate.sh

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Markdown lint (markdownlint-cli2)
        # Versão pinada em sincronia com tools/adr-lint/validate.sh:
        # bump exige edição coordenada dos dois para preservar paridade
        # dev↔CI (script local invoca o mesmo binary).
        run: npx --yes markdownlint-cli2@0.22.1 'docs/adrs/**/*.md'

  # Drift check do codegen OpenAPI (ADR-0013): regenera e diffa
  # libs/shared-data/src/lib/api/{selecao,ingresso}/schema.ts contra o
  # committed em HEAD. Falha se o spec mudou e o gerado não foi committed
  # junto. Job dedicado (em vez de step do `main`) torna o gate visível em
  # branch protection settings — ver `required_status_checks.contexts`.
  codegen-drift-check:
    name: codegen-drift-check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Instalar dependências
        run: npm ci --no-audit --no-fund

      - name: Verificar drift do codegen OpenAPI (shared-data)
        run: npx nx run shared-data:codegen-api-check

  main:
    runs-on: ubuntu-latest
    # Os gates completos levam de 16 a 23 minutos quando rodam sozinhos; o teto dá folga
    # para o pior caso sem deixar um run travado ocupar runner por horas. Os outros dois
    # jobs já declaravam o seu — este, que é o pesado, era o único sem.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          filter: tree:0
          fetch-depth: 0

      # Em pull_request, detecta se houve mudança em código frontend.
      # Em push para main, sempre rodamos os gates (passo abaixo decide).
      - id: changes
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@v3
        with:
          filters: |
            frontend:
              - 'apps/**'
              - 'libs/**'
              - 'package.json'
              - 'package-lock.json'
              - 'nx.json'
              - 'tsconfig*.json'
              - 'eslint.config.mjs'
              - 'vitest.workspace.ts'
              - 'playwright.config.ts'
              - 'docker/**'
              - 'tools/e2e-docker/**'
              - 'tools/test-nginx-base-href.sh'
              - '.github/workflows/ci.yml'

      - id: gate
        name: Decidir se gates frontend rodam
        run: |
          if [[ "${{ github.event_name }}" == "push" ]] || [[ "${{ steps.changes.outputs.frontend }}" == "true" ]]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "Gates frontend habilitados"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "PR sem mudancas em codigo frontend - pulando gates"
          fi

      # This enables task distribution via Nx Cloud.
      # Keep --stop-agents-after aligned with every target executed below so the
      # distributed run cannot finish before all blocking gates are reconciled.
      # Learn more at https://nx.dev/ci/reference/nx-cloud-cli#npx-nxcloud-startcirun
      - if: steps.gate.outputs.run == 'true'
        run: npx nx start-ci-run --distribute-on="3 linux-medium-js" --stop-agents-after="lint,test,build,typecheck"

      - if: steps.gate.outputs.run == 'true'
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - if: steps.gate.outputs.run == 'true'
        run: npm ci

      - name: Validar base href sob subpath
        if: steps.gate.outputs.run == 'true'
        run: bash tools/test-nginx-base-href.sh

      - if: steps.gate.outputs.run == 'true'
        run: npx nx record -- echo Hello World

      # Drift check do codegen OpenAPI vive em job dedicado `codegen-drift-check`
      # (ver acima) — required check em branch protection desde 2026-05-09.

      # Em pull_request, usamos `nx affected` para rodar apenas os projects
      # impactados pelo diff contra a branch base. Em push para main, fazemos
      # sweep completo via `nx run-many` como rede de segurança.
      #
      # `e2e` fora do gate obrigatório (issue #814): os 4 e2e sobem cada um seu
      # próprio dev-server Angular sequencialmente no mesmo runner, e o último
      # da fila trava sem erro explícito até o teto de 45min cancelar o job —
      # reproduzido tanto em push na main quanto em PR, mesmo depois do fix do
      # webServer (#812). Rodar via `npx nx e2e <app>-e2e` manualmente/local
      # enquanto a causa (recursos do runner) não é resolvida.
      - name: Rodar gates (nx affected — pull_request)
        if: steps.gate.outputs.run == 'true' && github.event_name == 'pull_request'
        run: npx nx affected -t lint test build typecheck --base=origin/${{ github.base_ref }} --head=HEAD --nxBail --outputStyle=static

      - name: Rodar gates (nx run-many — push em main)
        if: steps.gate.outputs.run == 'true' && github.event_name == 'push'
        run: npx nx run-many -t lint test build typecheck --nxBail --outputStyle=static

      - if: always() && steps.gate.outputs.run == 'true'
        run: npx nx fix-ci
