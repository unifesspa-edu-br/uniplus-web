name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  actions: read
  contents: read
  pull-requests: read

# Um run por referência. O push seguinte ao mesmo PR cancela o anterior, que já não
# descreve o que será integrado: sem isto, uma sequência de correções de revisão deixou
# SEIS runs da mesma branch vivos ao mesmo tempo, cada um carregando as quatro suítes de
# e2e com Keycloak, e todos disputando os mesmos runners — o gate passou de 20 minutos
# para quase três horas sem que o código tivesse mudado de tamanho.
#
# Em `main` é o contrário: cada commit integrado precisa da própria validação, e cancelar
# a anterior deixaria buraco no histórico de verificação. Daí a condição no valor.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  adr-lint:
    name: ADR lint (MADR 4.0)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Validar ADRs (MADR 4.0)
        run: bash tools/adr-lint/validate.sh

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Markdown lint (markdownlint-cli2)
        # Versão pinada em sincronia com tools/adr-lint/validate.sh:
        # bump exige edição coordenada dos dois para preservar paridade
        # dev↔CI (script local invoca o mesmo binary).
        run: npx --yes markdownlint-cli2@0.22.1 'docs/adrs/**/*.md'

  # Drift check do codegen OpenAPI (ADR-0013): regenera e diffa
  # libs/shared-data/src/lib/api/{selecao,ingresso}/schema.ts contra o
  # committed em HEAD. Falha se o spec mudou e o gerado não foi committed
  # junto. Job dedicado (em vez de step do `main`) torna o gate visível em
  # branch protection settings — ver `required_status_checks.contexts`.
  codegen-drift-check:
    name: codegen-drift-check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Instalar dependências
        run: npm ci --no-audit --no-fund

      - name: Verificar drift do codegen OpenAPI (shared-data)
        run: npx nx run shared-data:codegen-api-check

  # Os gates rodam em jobs separados, cada um no seu runner. Fatos observados com os gates num
  # job só: o run 43551538979 (PR #1478) foi cancelado no teto de tempo e, no run de push
  # 43551403356, testes de `configuracao` estouraram o timeout por caso enquanto `selecao` rodava
  # ao lado; antes disso, runs foram encerrados com "The runner has received a shutdown signal".
  # A hipótese é contenção de CPU e memória entre as tarefas do mesmo runner. Um runner por alvo
  # e por projeto de teste elimina essa disputa. O job `main` virou o agregador desses jobs e
  # mantém o nome do check exigido pela proteção da `main`.
  escopo:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      run: ${{ steps.gate.outputs.run }}
      testes: ${{ steps.projetos.outputs.testes }}
    steps:
      - uses: actions/checkout@v4
        with:
          filter: tree:0
          fetch-depth: 0

      # Em pull_request, detecta se houve mudança em código frontend.
      # Em push para main, sempre rodamos os gates (passo abaixo decide).
      - id: changes
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@v3
        with:
          filters: |
            frontend:
              - 'apps/**'
              - 'libs/**'
              - 'package.json'
              - 'package-lock.json'
              - 'nx.json'
              - 'tsconfig*.json'
              - 'eslint.config.mjs'
              - 'vitest.workspace.ts'
              - 'playwright.config.ts'
              - 'docker/**'
              - 'tools/e2e-docker/**'
              - 'tools/test-nginx-base-href.sh'
              - '.github/workflows/ci.yml'
              - '.github/actions/**'

      - id: gate
        name: Decidir se gates frontend rodam
        run: |
          if [[ "${{ github.event_name }}" == "push" ]] || [[ "${{ steps.changes.outputs.frontend }}" == "true" ]]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "Gates frontend habilitados"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "PR sem mudancas em codigo frontend - pulando gates"
          fi

      - if: steps.gate.outputs.run == 'true'
        uses: ./.github/actions/preparar-ambiente

      - name: Validar base href sob subpath
        if: steps.gate.outputs.run == 'true'
        run: bash tools/test-nginx-base-href.sh

      # Os projetos com teste viram uma matriz: cada um roda no seu runner. Em pull_request são os
      # impactados pelo diff contra a branch base (o mesmo conjunto do `nx affected`); em push na
      # main, todos.
      - id: projetos
        if: steps.gate.outputs.run == 'true'
        env:
          EVENTO: ${{ github.event_name }}
          BASE: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          if [[ "$EVENTO" == "pull_request" ]]; then
            bruto=$(npx nx show projects --affected --with-target=test --base="origin/$BASE" --head=HEAD --json)
          else
            bruto=$(npx nx show projects --with-target=test --json)
          fi
          testes=$(jq -ce 'if type == "array" then . else error("a saída do nx não é um array") end' <<< "$bruto")
          echo "Projetos com teste: $testes"
          echo "testes=$testes" >> "$GITHUB_OUTPUT"

  # Drift check do codegen OpenAPI vive em job dedicado `codegen-drift-check`
  # (ver acima) — required check em branch protection desde 2026-05-09.
  #
  # Em pull_request, usamos `nx affected` para rodar apenas os projects
  # impactados pelo diff contra a branch base. Em push para main, fazemos
  # sweep completo via `nx run-many` como rede de segurança.
  #
  # `e2e` fora do gate obrigatório (issue #814): os 4 e2e sobem cada um seu
  # próprio dev-server Angular sequencialmente no mesmo runner, e o último
  # da fila trava sem erro explícito até o teto de 45min cancelar o job —
  # reproduzido tanto em push na main quanto em PR, mesmo depois do fix do
  # webServer (#812). Rodar via `npx nx e2e <app>-e2e` manualmente/local
  # enquanto a causa (recursos do runner) não é resolvida.
  verificar:
    name: gate (${{ matrix.alvo }})
    needs: escopo
    if: needs.escopo.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        alvo: [lint, typecheck, typecheck-spec, build]
    env:
      NX_PARALLEL: 2
    steps:
      - uses: actions/checkout@v4
        with:
          filter: tree:0
          fetch-depth: 0

      - uses: ./.github/actions/preparar-ambiente

      - name: Rodar o alvo (nx affected em pull_request, nx run-many em push na main)
        env:
          ALVO: ${{ matrix.alvo }}
          EVENTO: ${{ github.event_name }}
          BASE: ${{ github.base_ref }}
        run: |
          if [[ "$EVENTO" == "pull_request" ]]; then
            npx nx affected -t "$ALVO" --base="origin/$BASE" --head=HEAD --nxBail --outputStyle=static
          else
            npx nx run-many -t "$ALVO" --nxBail --outputStyle=static
          fi

  testes:
    name: test (${{ matrix.projeto }})
    needs: escopo
    if: needs.escopo.outputs.run == 'true' && needs.escopo.outputs.testes != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        projeto: ${{ fromJSON(needs.escopo.outputs.testes) }}
    steps:
      - uses: actions/checkout@v4
        with:
          filter: tree:0
          fetch-depth: 0

      - uses: ./.github/actions/preparar-ambiente

      - name: Rodar os testes do projeto
        env:
          PROJETO: ${{ matrix.projeto }}
        run: npx nx run "$PROJETO:test" --outputStyle=static

  # Check exigido pela proteção da `main` (nome contratual, ver CONTRIBUTING.md § Required CI checks).
  # Falha se qualquer gate falhou ou foi cancelado; gates pulados (PR sem mudança de frontend) passam.
  main:
    needs: [escopo, verificar, testes]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Consolidar o resultado dos gates
        env:
          RESULTADOS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Resultados: $RESULTADOS"
          if [[ " $RESULTADOS " == *" failure "* ]] || [[ " $RESULTADOS " == *" cancelled "* ]]; then
            exit 1
          fi
