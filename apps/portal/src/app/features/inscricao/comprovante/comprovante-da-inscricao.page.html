<insc-comprovante-do-envio
  titulo="Comprovante de inscrição"
  descricao="Guarde este comprovante. Ele registra o que você enviou nesta inscrição."
  [fonte]="fonte()"
  [numero]="numero()"
  [recusas]="recusas"
  [rotaDoEnvio]="rotaDoEnvio"
  [cpf]="cpf()"
>
  <a inscAcaoDoDocumento class="btn btn--tertiary" routerLink="/inscricao">
    Voltar às minhas inscrições
  </a>
  <ng-template inscAcaoDaCorrecao let-comprovante>
    <a
      class="btn btn--secondary u-no-print"
      [routerLink]="['/inscricao', comprovante.processoSeletivoId]"
    >
      Corrigir dados
    </a>
  </ng-template>
</insc-comprovante-do-envio>
