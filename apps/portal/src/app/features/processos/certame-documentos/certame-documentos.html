<button
  type="button"
  class="documentos-toggle"
  [id]="botaoId()"
  [attr.aria-expanded]="aberto()"
  [attr.aria-controls]="painelId()"
  (click)="alternar()"
>
  <i class="pi pi-caret-down documentos-toggle__icon" aria-hidden="true"></i>
  <span class="documentos-toggle__label">Documentos exigidos</span>
  @if (certameNome()) {
    <span class="sr-only"> — {{ certameNome() }}</span>
  }
</button>

<div
  class="documentos-painel"
  [id]="painelId()"
  role="region"
  [attr.aria-labelledby]="botaoId()"
  [hidden]="!aberto()"
>
  @if (aberto()) {
    @if (falhou()) {
      <ui-alert variant="danger" heading="Não foi possível carregar os documentos exigidos">
        Recarregue a página para tentar outra vez.
      </ui-alert>
    } @else if (carregando()) {
      <div class="documentos-loading" role="status">
        <ui-spinner spinnerSize="sm" accessibleName="Carregando documentos exigidos" />
        Carregando documentos exigidos…
      </div>
    } @else {
      <ui-lista-de-documentos
        [documentos]="documentos()"
        [contexto]="certameNome()"
        semDocumentos="Esta página não lista documentos para este processo. Consulte o edital."
      />
    }
  }
</div>
