<ui-dialog
  [heading]="titulo()"
  [(visible)]="aberto"
  [dismissible]="!removendo()"
  [describedBy]="idDaMensagem"
  (closed)="fechado.emit()"
>
  @if (item(); as nomeado) {
    <p>
      {{ nomeado.abertura }}
      @if (nomeado.codigo) {
        <code>{{ nomeado.codigo }}</code> —
      }
      <strong>{{ nomeado.nome }}.</strong>
    </p>
  }
  <p [id]="idDaMensagem">{{ mensagem() }}</p>
  <span class="sr-only" role="status">{{ anuncio() }}</span>
  @if (erro()) {
    <p class="field__error">{{ erro() }}</p>
  }
  <ng-container uiDialogFooter>
    <button
      type="button"
      class="btn btn--tertiary"
      data-testid="confirm-dialog-cancel"
      [disabled]="removendo()"
      (click)="aberto.set(false)"
    >
      Cancelar
    </button>
    <button
      type="button"
      class="btn"
      [class.btn--danger]="variante() === 'danger'"
      [class.btn--primary]="variante() === 'primary'"
      data-testid="confirm-dialog-confirm"
      [attr.aria-disabled]="removendo() ? 'true' : null"
      [attr.aria-busy]="removendo() ? 'true' : null"
      (click)="aoConfirmar($event)"
    >
      {{ rotulo() }}
    </button>
  </ng-container>
</ui-dialog>
