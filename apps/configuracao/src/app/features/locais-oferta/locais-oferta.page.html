<div class="page-header">
  <div class="page-header__content">
    <h1 class="page-header__title">Locais de oferta</h1>
    <p class="page-header__desc">
      Locais de oferta (polos, campi fora de sede, convênios) com endereço estruturado ·
      UNI-REQ-0010.
    </p>
  </div>
</div>

<ui-falha-de-leitura titulo="Não foi possível carregar os locais de oferta" [leitura]="leitura" />

<p class="sr-only" role="status">{{ edicao.anuncioDaPagina() }}</p>
<cfg-locais-oferta-lista
  [locais]="store.locais()"
  [carregando]="store.carregando()"
  [gravando]="edicao.gravando()"
  [mensagemDeErro]="store.mensagemDeErro()"
  [temAnterior]="store.anterior() !== null"
  [temProximo]="store.proximo() !== null"
  [leituras]="leiturasDaLista"
  [resolucoes]="store.resolucoes()"
  [localAfetadoId]="edicao.localAfetadoId()"
  [andamento]="edicao.andamento()"
  (cadastrar)="abrirCadastro()"
  (editar)="abrirEdicao($event)"
  (remover)="edicao.pedirRemocao($event)"
  (anterior)="store.paginaAnterior()"
  (proximo)="store.proximaPagina()"
/>
<cfg-local-oferta-formulario
  [aberto]="edicao.formOpen()"
  [form]="edicao.form"
  [modo]="edicao.modo()"
  [titulo]="edicao.formHeading()"
  [erro]="edicao.formError()"
  [erroDoEndereco]="edicao.enderecoErro()"
  [salvando]="edicao.saving()"
  [gravando]="edicao.gravando()"
  [campi]="store.campi.opcoes()"
  [leituraDosCampi]="leituraDosCampi"
  (salvar)="edicao.salvar()"
  (cancelar)="edicao.fechar()"
/>
<cfg-confirmacao-de-remocao
  titulo="Remover local de oferta"
  [(aberto)]="edicao.confirmOpen"
  [mensagem]="edicao.confirmMessage()"
  [removendo]="edicao.removendo()"
  [erro]="edicao.erroDaRemocao()"
  [anuncio]="edicao.anuncioDaRemocao()"
  (confirmar)="edicao.removerConfirmado()"
/>
