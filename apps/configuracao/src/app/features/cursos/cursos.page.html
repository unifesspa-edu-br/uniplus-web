<div class="page-header">
  <div class="page-header__content">
    <h1 class="page-header__title">Curso</h1>
    <p class="page-header__desc">
      Matriz curricular pura — código, nome, grau, nível de ensino e grupo de área do ENEM opcional.
      Local, unidade e e-MEC pertencem à Oferta de Curso. UNI-REQ-0010.
    </p>
  </div>
</div>

@if (store.mensagemDeErro()) {
<ui-alert variant="danger" heading="Não foi possível carregar os cursos">
  {{ store.mensagemDeErro() }}
  <div class="cfg-cursos__retry">
    <button
      type="button"
      class="btn btn--secondary btn--sm"
      [disabled]="store.carregando()"
      (click)="store.tentarNovamente()"
    >
      Tentar novamente
    </button>
  </div>
</ui-alert>
}

<cfg-cursos-lista
  [cursos]="store.cursosExibidos()"
  [carregando]="store.carregando()"
  [removendo]="edicao.removendo()"
  [anuncioDaRemocao]="edicao.anuncioDaRemocao()"
  [mensagemDeErro]="store.mensagemDeErro()"
  [temBusca]="store.temBusca()"
  [limite]="store.limite()"
  [temAnterior]="store.anterior() !== null"
  [temProximo]="store.proximo() !== null"
  [(termoBusca)]="store.termoBusca"
  (cadastrar)="edicao.abrirCadastro()"
  (editar)="edicao.abrirEdicao($event)"
  (remover)="edicao.pedirRemocao($event)"
  (verOfertas)="ofertas.abrir($event)"
  (trocarLimite)="store.aoTrocarLimite($event)"
  (anterior)="store.paginaAnterior()"
  (proximo)="store.proximaPagina()"
/>

<cfg-curso-formulario
  [(aberto)]="edicao.aberto"
  [form]="edicao.form"
  [modo]="edicao.modo()"
  [titulo]="edicao.titulo()"
  [erro]="edicao.erro()"
  [salvando]="edicao.salvando()"
  [grupos]="edicao.grupos()"
  (salvar)="edicao.salvar()"
  (cancelar)="edicao.fechar()"
  (tentarGrupos)="edicao.tentarCarregarGrupos()"
/>

<ui-confirm-dialog
  [(visible)]="edicao.confirmando"
  heading="Remover curso"
  [message]="edicao.mensagemDaConfirmacao()"
  confirmLabel="Remover"
  confirmVariant="danger"
  (confirmed)="edicao.removerConfirmado()"
/>

<cfg-ofertas-do-curso
  [(aberto)]="ofertas.aberto"
  [titulo]="ofertas.titulo()"
  [bloqueio]="ofertas.bloqueio()"
  [mensagemDeErro]="ofertas.mensagemDeErro()"
  [carregando]="ofertas.carregando()"
  [ofertas]="ofertas.itens()"
  [temAnterior]="ofertas.anterior() !== null"
  [temProximo]="ofertas.proximo() !== null"
  (fechado)="ofertas.aoFechar()"
  (recarregar)="ofertas.recarregar()"
  (anterior)="ofertas.paginaAnterior()"
  (proximo)="ofertas.proximaPagina()"
/>
