<div class="field" [class.is-error]="dados().erro !== null">
  <label class="field__label is-required" [for]="campo()?.campoId()">Municípios</label>
  <ui-valor-de-municipio
    [multiplo]="true"
    [obrigatorio]="true"
    rotulo="Municípios"
    [values]="codigos()"
    [rotulosGravados]="rotulos()"
    [invalido]="dados().erro !== null"
    [descritoPor]="dados().erro ? 'cfg-blbr-municipios-erro' : null"
    (valuesChange)="escolher.emit($event)"
  />

  @if (dados().selecionados.length > 0) {
    <ul class="cfg-municipio-selecionados" aria-label="Municípios selecionados">
      @for (municipio of dados().selecionados; track municipio.codigoIbge) {
        <li>
          <span>{{ municipio.nome }} — {{ municipio.uf }}</span>
          <button
            type="button"
            class="btn btn--tertiary btn--sm btn--rect"
            [attr.aria-label]="'Remover ' + municipio.nome"
            (click)="aoRemover(municipio.codigoIbge, $event)"
          >
            Remover
          </button>
        </li>
      }
    </ul>
  } @else {
    <span class="field__hint">Nenhum município adicionado ainda.</span>
  }

  @if (dados().erro; as erro) {
    <span class="field__error" id="cfg-blbr-municipios-erro" role="alert">{{ erro }}</span>
  }
</div>
