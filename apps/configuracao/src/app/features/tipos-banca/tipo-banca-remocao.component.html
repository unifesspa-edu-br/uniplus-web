<ui-dialog heading="Remover tipo de banca" [(visible)]="aberto" [dismissible]="!removendo()">
  <p>{{ mensagem() }}</p>
  <span class="sr-only" role="status">{{ anuncio() }}</span>
  @if (erro()) {
    <p class="field__error">{{ erro() }}</p>
  }
  <ng-container uiDialogFooter>
    <button
      type="button"
      class="btn btn--tertiary"
      [disabled]="removendo()"
      (click)="aberto.set(false)"
    >
      Cancelar
    </button>
    <button
      type="button"
      class="btn btn--danger"
      data-testid="confirm-dialog-confirm"
      [attr.aria-disabled]="removendo() ? 'true' : null"
      [attr.aria-busy]="removendo() ? 'true' : null"
      (click)="aoConfirmar($event)"
    >
      Remover
    </button>
  </ng-container>
</ui-dialog>
