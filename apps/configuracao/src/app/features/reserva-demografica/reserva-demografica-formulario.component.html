<ui-drawer
  class="form-drawer"
  [(visible)]="aberto"
  [closable]="!salvando()"
  [heading]="titulo()"
  ariaLabel="Formulário de referência demográfica"
  position="right"
>
  <span class="sr-only" role="status">{{ anuncio() }}</span>
  @if (erro()) {
    <ui-alert variant="danger" heading="Não foi possível salvar">{{ erro() }}</ui-alert>
  }

  <form
    [formGroup]="form()"
    id="cfg-reserva-form"
    (ngSubmit)="aoEnviar()"
    novalidate
    class="form-drawer__form"
  >
    <fieldset class="form-drawer__campos" role="none" [disabled]="salvando()">
      <section aria-labelledby="cfg-reserva-dados">
        <h3 id="cfg-reserva-dados" class="form-section__title">Dados do Censo</h3>
        <div class="form-grid">
          <label class="field form-grid__full" [class.is-error]="erroDoCampo('censoReferencia')">
            <span class="field__label is-required">Censo de referência</span>
            <input
              class="input"
              type="text"
              inputmode="numeric"
              aria-required="true"
              formControlName="censoReferencia"
              [attr.aria-describedby]="
                erroDoCampo('censoReferencia') ? 'erro-censoReferencia' : null
              "
              [attr.aria-invalid]="erroDoCampo('censoReferencia') ? 'true' : null"
              (blur)="verificarCenso.emit()"
            />
            <span class="field__hint">
              Chave de negócio — uma linha por Censo, única entre as referências ativas. Não pode
              ser alterada após a criação.
            </span>
            @if (erroDoCampo('censoReferencia')) {
              <span id="erro-censoReferencia" class="field__error">{{
                erroDoCampo('censoReferencia')
              }}</span>
            }
          </label>

          <div class="form-grid--pair">
            <label class="field" [class.is-error]="erroDoCampo('ppiPercentual')">
              <span class="field__label is-required">PPI %</span>
              <input
                class="input"
                type="number"
                inputmode="decimal"
                min="0"
                max="100"
                step="0.01"
                aria-required="true"
                formControlName="ppiPercentual"
                [attr.aria-describedby]="erroDoCampo('ppiPercentual') ? 'erro-ppiPercentual' : null"
                [attr.aria-invalid]="erroDoCampo('ppiPercentual') ? 'true' : null"
              />
              <span class="field__hint"
                >Pretos, pardos e indígenas (art. 10, III, "a"). 0 a 100.</span
              >
              @if (erroDoCampo('ppiPercentual')) {
                <span id="erro-ppiPercentual" class="field__error">{{
                  erroDoCampo('ppiPercentual')
                }}</span>
              }
            </label>
            <label class="field" [class.is-error]="erroDoCampo('quilombolaPercentual')">
              <span class="field__label is-required">Quilombola %</span>
              <input
                class="input"
                type="number"
                inputmode="decimal"
                min="0"
                max="100"
                step="0.01"
                aria-required="true"
                formControlName="quilombolaPercentual"
                [attr.aria-describedby]="
                  erroDoCampo('quilombolaPercentual') ? 'erro-quilombolaPercentual' : null
                "
                [attr.aria-invalid]="erroDoCampo('quilombolaPercentual') ? 'true' : null"
              />
              <span class="field__hint">Quilombolas (art. 10, III, "b"). 0 a 100.</span>
              @if (erroDoCampo('quilombolaPercentual')) {
                <span id="erro-quilombolaPercentual" class="field__error">{{
                  erroDoCampo('quilombolaPercentual')
                }}</span>
              }
            </label>
          </div>

          <label class="field form-grid__full" [class.is-error]="erroDoCampo('pcdPercentual')">
            <span class="field__label is-required">PcD %</span>
            <input
              class="input"
              type="number"
              inputmode="decimal"
              min="0"
              max="100"
              step="0.01"
              aria-required="true"
              formControlName="pcdPercentual"
              [attr.aria-describedby]="erroDoCampo('pcdPercentual') ? 'erro-pcdPercentual' : null"
              [attr.aria-invalid]="erroDoCampo('pcdPercentual') ? 'true' : null"
            />
            <span class="field__hint">
              Pessoas com deficiência / Grupo de Washington (art. 10, III, "c", p.u.). 0 a 100.
            </span>
            @if (erroDoCampo('pcdPercentual')) {
              <span id="erro-pcdPercentual" class="field__error">{{
                erroDoCampo('pcdPercentual')
              }}</span>
            }
          </label>

          <label class="field form-grid__full" [class.is-error]="erroDoCampo('baseLegal')">
            <span class="field__label is-required">Base legal</span>
            <input
              class="input"
              type="text"
              placeholder="Lei 12.711/2012, art. 10, III"
              aria-required="true"
              formControlName="baseLegal"
              [attr.aria-describedby]="erroDoCampo('baseLegal') ? 'erro-baseLegal' : null"
              [attr.aria-invalid]="erroDoCampo('baseLegal') ? 'true' : null"
            />
            <span class="field__hint"
              >Dispositivo exato (lei + artigo/parágrafo) que fundamenta os percentuais.</span
            >
            @if (erroDoCampo('baseLegal')) {
              <span id="erro-baseLegal" class="field__error">{{ erroDoCampo('baseLegal') }}</span>
            }
          </label>
        </div>
      </section>
    </fieldset>
  </form>

  <div class="form-drawer__footer">
    <button
      type="button"
      class="btn btn--tertiary btn--rect"
      [disabled]="salvando()"
      (click)="cancelar.emit()"
    >
      Cancelar
    </button>
    <button
      type="submit"
      form="cfg-reserva-form"
      class="btn btn--primary"
      [attr.aria-disabled]="salvando() ? 'true' : null"
      [attr.aria-busy]="salvando() ? 'true' : null"
      (click)="salvando() ? $event.preventDefault() : null"
    >
      @if (salvando()) {
        <ui-spinner spinnerSize="sm" />
      }
      {{ rotuloDoBotao() }}
    </button>
  </div>
</ui-drawer>
