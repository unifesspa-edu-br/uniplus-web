<ng-container [formGroup]="grupo()">
  <label
    class="field form-grid__full"
    [class.is-error]="erros().abrangencia"
    [attr.for]="'abrangencia-' + sufixoDeId()"
  >
    <span class="field__label is-required">Abrangência</span>
    <select
      class="select"
      formControlName="abrangencia"
      aria-required="true"
      [id]="'abrangencia-' + sufixoDeId()"
      [attr.aria-invalid]="erros().abrangencia ? 'true' : null"
      [attr.aria-describedby]="
        leituraDasAbrangencias.visivel() ? 'falha-abrangencia-' + sufixoDeId() : null
      "
      (change)="aplicarAbrangencia(grupo())"
    >
      @for (abrangencia of abrangencias.opcoes(); track abrangencia.codigo) {
        <option [value]="abrangencia.codigo">{{ abrangencia.rotulo }}</option>
      }
    </select>
    @if (abrangencias.carregando() && !leituraDasAbrangencias.visivel()) {
      <span role="status">Carregando abrangências…</span>
    }
    @if (erros().abrangencia) {
      <span class="field__error">{{ erros().abrangencia }}</span>
    }
  </label>
  <ui-falha-de-leitura-do-campo
    [id]="'falha-abrangencia-' + sufixoDeId()"
    [leitura]="leituraDasAbrangencias"
  />

  @if (
    abrangenciaAtual() === abrangenciaCodigo.MUNICIPAL ||
    abrangenciaAtual() === abrangenciaCodigo.ESTADUAL
  ) {
    <label class="field form-grid__full" [class.is-error]="erros().uf">
      <span class="field__label is-required">
        {{
          abrangenciaAtual() === abrangenciaCodigo.MUNICIPAL
            ? 'Estado para busca'
            : 'Unidade Federativa (UF)'
        }}
      </span>
      <select
        class="select"
        formControlName="uf"
        aria-required="true"
        [id]="'uf-' + sufixoDeId()"
        [attr.aria-invalid]="erros().uf ? 'true' : null"
        (change)="reiniciarBuscaDoMunicipio(grupo())"
      >
        @for (unidadeFederativa of unidadesFederativas; track unidadeFederativa.id) {
          <option [value]="unidadeFederativa.sigla">
            {{ unidadeFederativa.nome }} - {{ unidadeFederativa.sigla }}
          </option>
        }
      </select>
      @if (erros().uf) {
        <span class="field__error">{{ erros().uf }}</span>
      }
    </label>
  }

  @if (abrangenciaAtual() === abrangenciaCodigo.MUNICIPAL) {
    <div
      class="field form-grid__full cfg-dia-card__municipio"
      [class.is-error]="erros().codigoMunicipio"
    >
      <label [for]="municipio.campoId()" class="field__label is-required">Município</label>
      <ui-valor-de-municipio
        #municipio
        rotulo="Município"
        [values]="valores()"
        [rotulosGravados]="rotulos()"
        [uf]="ufDaBuscaDe(grupo())"
        [obrigatorio]="true"
        [invalido]="!!erros().codigoMunicipio"
        [descritoPor]="erros().codigoMunicipio ? 'erro-municipio-' + sufixoDeId() : null"
        (valuesChange)="escolherMunicipio($event)"
      />
      @if (erros().codigoMunicipio) {
        <span class="field__error" [id]="'erro-municipio-' + sufixoDeId()">{{
          erros().codigoMunicipio
        }}</span>
      }
    </div>
  }

  <label class="field" [class.is-error]="erros().data">
    <span class="field__label is-required">Data</span>
    <input
      class="input"
      type="date"
      formControlName="data"
      aria-required="true"
      [id]="'data-' + sufixoDeId()"
      [attr.aria-invalid]="erros().data ? 'true' : null"
    />
    <span class="field__hint">Não repita a mesma data, abrangência e região.</span>
    @if (erros().data) {
      <span class="field__error">{{ erros().data }}</span>
    }
  </label>

  <label
    class="field form-grid__full cfg-dia-card__descricao-field"
    [class.is-error]="erros().descricao"
  >
    <span class="field__label is-required">Descrição</span>
    <textarea
      class="textarea cfg-dia-card__descricao"
      formControlName="descricao"
      aria-required="true"
      placeholder="Ex.: Aniversário do município"
      [id]="'descricao-' + sufixoDeId()"
      [attr.aria-invalid]="erros().descricao ? 'true' : null"
    ></textarea>
    <span class="field__hint">Até 200 caracteres.</span>
    @if (erros().descricao) {
      <span class="field__error">{{ erros().descricao }}</span>
    }
  </label>
</ng-container>
