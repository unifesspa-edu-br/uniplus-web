<div class="page-header">
  <div class="page-header__content">
    <h1 class="page-header__title">Recurso de Acessibilidade</h1>
    <p class="page-header__desc">
      Recursos oferecidos no atendimento especializado, independentes da condição — cadastro
      identificado pelo código · UNI-REQ-0012.
    </p>
  </div>
</div>

@if (store.mensagemDeErro()) {
<ui-alert variant="danger" heading="Não foi possível carregar os recursos de acessibilidade">
  {{ store.mensagemDeErro() }}
  <div class="list-state__retry">
    <button
      type="button"
      class="btn btn--secondary btn--sm"
      [attr.aria-disabled]="pendente() ? 'true' : null"
      [attr.aria-busy]="pendente() ? 'true' : null"
      (click)="tentarNovamente()"
    >
      Tentar novamente
    </button>
  </div>
</ui-alert>
}

<span class="sr-only" role="status">{{ edicao.anuncioDaPagina() }}</span>
<cfg-recursos-acessibilidade-lista
  [recursos]="store.recursosFiltrados()"
  [carregando]="store.carregando()"
  [gravando]="edicao.gravando()"
  [removendo]="edicao.removendo()"
  [andamento]="edicao.andamento()"
  [erro]="store.mensagemDeErro()"
  [temFiltro]="store.temFiltro()"
  [temAnterior]="store.anterior() !== null"
  [temProximo]="store.proximo() !== null"
  [(termoBusca)]="store.termoBusca"
  (cadastrar)="edicao.abrirCadastro()"
  (editar)="edicao.abrirEdicao($event)"
  (remover)="edicao.pedirRemocao($event)"
  (anterior)="store.paginaAnterior()"
  (proximo)="store.proximaPagina()"
/>
<cfg-recurso-acessibilidade-formulario
  [(aberto)]="edicao.aberto"
  [form]="edicao.form"
  [titulo]="edicao.titulo()"
  [erro]="edicao.erro()"
  [anuncio]="edicao.anuncioDoSalvamento()"
  [modo]="edicao.modo()"
  [salvando]="edicao.salvando()"
  (salvar)="edicao.salvar()"
  (cancelar)="edicao.fechar()"
/>
<cfg-confirmacao-de-remocao
  titulo="Remover recurso de acessibilidade?"
  [(aberto)]="edicao.confirmando"
  [item]="edicao.itemDaConfirmacao()"
  [mensagem]="edicao.mensagemDaConfirmacao()"
  [removendo]="edicao.removendo()"
  [erro]="edicao.erroDaRemocao()"
  [anuncio]="edicao.anuncioDaRemocao()"
  (confirmar)="edicao.removerConfirmado()"
/>
