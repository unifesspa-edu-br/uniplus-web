<ui-drawer
  class="form-drawer"
  [(visible)]="aberto"
  [closable]="!salvando()"
  [heading]="titulo()"
  ariaLabel="Formulário de campus"
  position="right"
>
  @if (erro()) {
    <ui-alert variant="danger" heading="Não foi possível salvar">{{ erro() }}</ui-alert>
  }

  <form
    [formGroup]="form()"
    id="cfg-campus-form"
    (ngSubmit)="aoEnviar()"
    novalidate
    class="form-drawer__form"
  >
    <fieldset class="form-drawer__campos" role="none" [disabled]="salvando()">
      <section aria-labelledby="cfg-campus-identificacao">
        <h3 id="cfg-campus-identificacao" class="form-section__title">Identificação</h3>
        <div class="form-grid">
          <label class="field" [class.is-error]="erroDoCampo('sigla')">
            <span class="field__label is-required">Sigla</span>
            <input
              class="input"
              type="text"
              formControlName="sigla"
              [attr.aria-invalid]="erroDoCampo('sigla') ? 'true' : null"
            />
            @if (erroDoCampo('sigla')) {
              <span class="field__error">{{ erroDoCampo('sigla') }}</span>
            }
          </label>
          <label class="field" [class.is-error]="erroDoCampo('codigoEmec')">
            <span class="field__label">Código e-MEC</span>
            <input
              class="input"
              type="text"
              inputmode="numeric"
              formControlName="codigoEmec"
              [attr.aria-invalid]="erroDoCampo('codigoEmec') ? 'true' : null"
            />
            @if (erroDoCampo('codigoEmec')) {
              <span class="field__error">{{ erroDoCampo('codigoEmec') }}</span>
            }
          </label>
          <label class="field form-grid__full" [class.is-error]="erroDoCampo('nome')">
            <span class="field__label is-required">Nome</span>
            <input
              class="input"
              type="text"
              formControlName="nome"
              [attr.aria-invalid]="erroDoCampo('nome') ? 'true' : null"
            />
            @if (erroDoCampo('nome')) {
              <span class="field__error">{{ erroDoCampo('nome') }}</span>
            }
          </label>
        </div>
      </section>

      <ui-endereco-geo
        formControlName="endereco"
        idPrefix="campus-endereco"
        legend="Endereço do campus"
        [erroExterno]="erroDoEndereco()"
      />
    </fieldset>
  </form>

  <div class="form-drawer__footer">
    <button
      type="button"
      class="btn btn--tertiary btn--rect"
      [disabled]="salvando()"
      (click)="cancelar.emit()"
    >
      Cancelar
    </button>
    <button
      type="submit"
      form="cfg-campus-form"
      class="btn btn--primary"
      [attr.aria-disabled]="salvando() ? 'true' : null"
      [attr.aria-busy]="salvando() ? 'true' : null"
      (click)="aoClicarEmSalvar($event)"
    >
      @if (salvando()) {
        <ui-spinner size="sm" />
      }
      {{ salvando() ? 'Salvando...' : modo() === 'criar' ? 'Criar campus' : 'Salvar campus' }}
    </button>
  </div>
</ui-drawer>
