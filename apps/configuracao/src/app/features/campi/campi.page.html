<div class="page-header">
  <div class="page-header__content">
    <h1 class="page-header__title">Campi</h1>
    <p class="page-header__desc">
      Campi da instituição com endereço estruturado (referência ao Geo) · UNI-REQ-0009.
    </p>
  </div>
</div>

<ui-falha-de-leitura
  titulo="Não foi possível carregar os campi"
  idBotao="cfg-campi-tentar-novamente"
  [leitura]="leitura"
/>

<cfg-campi-lista
  [campi]="store.campi()"
  [carregando]="store.carregando()"
  [gravando]="edicao.gravando()"
  [removendo]="edicao.removendo()"
  [anuncioDoResultado]="edicao.anuncioDaPagina()"
  [mensagemDeErro]="store.mensagemDeErro()"
  [temAnterior]="store.anterior() !== null"
  [temProximo]="store.proximo() !== null"
  (cadastrar)="edicao.abrirCadastro()"
  (editar)="edicao.abrirEdicao($event)"
  (remover)="edicao.pedirRemocao($event)"
  (anterior)="store.paginaAnterior()"
  (proximo)="store.proximaPagina()"
/>

<cfg-campus-formulario
  [(aberto)]="edicao.aberto"
  [form]="edicao.form"
  [modo]="edicao.modo()"
  [titulo]="edicao.titulo()"
  [erro]="edicao.erro()"
  [erroDoEndereco]="edicao.erroDoEndereco()"
  [salvando]="edicao.salvando()"
  (salvar)="edicao.salvar()"
  (cancelar)="edicao.fechar()"
/>

<cfg-confirmacao-de-remocao
  titulo="Remover campus"
  [(aberto)]="edicao.confirmando"
  [mensagem]="edicao.mensagemDaConfirmacao()"
  [removendo]="edicao.removendo()"
  [erro]="edicao.erroDaRemocao()"
  [anuncio]="edicao.anuncioDaRemocao()"
  (confirmar)="edicao.removerConfirmado()"
/>
