<div class="field form-grid__full" [class.is-error]="erroDoSalvamento() !== null">
  <label
    class="field__label"
    [for]="selecionada() ? 'cfg-unidade-cidade-busca' : campo()?.campoId()"
    >Cidade</label
  >
  @if (selecionada(); as cidade) {
    <div class="input-group">
      <input
        id="cfg-unidade-cidade-busca"
        class="input"
        readonly
        [attr.aria-invalid]="erroDoSalvamento() !== null || null"
        [attr.aria-describedby]="descricao()"
        [value]="cidade.nome + ' — ' + cidade.uf"
      />
      <button type="button" class="btn btn--tertiary" (click)="trocar.emit()">Trocar cidade</button>
    </div>
  } @else {
    <ui-valor-de-municipio
      rotulo="Cidade"
      [values]="[]"
      [invalido]="erroDoSalvamento() !== null"
      [descritoPor]="descricao()"
      (valuesChange)="escolherCodigo($event)"
    />
  }
  <span class="field__hint" id="cfg-unidade-cidade-hint"
    >Cidade-sede de referência da unidade. Opcional.</span
  >
  @if (erroDoSalvamento(); as erro) {
    <span class="field__error" id="cfg-unidade-cidade-erro" role="alert">{{ erro }}</span>
  }
</div>
