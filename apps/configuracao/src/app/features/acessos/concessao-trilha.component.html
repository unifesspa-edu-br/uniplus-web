<ui-drawer
  class="cfg-detail-drawer cfg-detail-drawer--ampla"
  [(visible)]="aberto"
  heading="Trilha da concessão"
  ariaLabel="Trilha da concessão"
  position="right"
>
  <div [id]="idDaTrilha" tabindex="-1">
    @if (leitura().pendente()) {
      <p [uiIndicadorDaLeitura]="leitura()"><ui-spinner spinnerSize="sm" /> Carregando a trilha…</p>
    }
    <ui-falha-de-leitura titulo="Não foi possível carregar a trilha" [leitura]="leitura()" />
    <cfg-recusa-da-leitura naoEncontrado="Trilha não encontrada" [recusa]="recusa()">
      Feche o painel e escolha outra concessão.
    </cfg-recusa-da-leitura>
    @if (!leitura().pendente() && !leitura().visivel() && recusa() === null) {
      <cfg-trilha-de-acesso [eventos]="eventos()" legenda="Trilha da concessão" />
    }
  </div>
</ui-drawer>
