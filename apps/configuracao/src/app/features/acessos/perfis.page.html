<div class="page-header">
  <div class="page-header__content">
    <h1 class="page-header__title">Perfis de acesso</h1>
    <p class="page-header__desc">
      Conjuntos nomeados de permissões. Mudar um perfil vale para todas as concessões dele.
    </p>
  </div>
  <div class="page-header__actions">
    <button
      type="button"
      class="btn btn--primary"
      [disabled]="edicao.gravando()"
      (click)="edicao.abrirCriacao()"
    >
      Novo perfil
    </button>
  </div>
</div>

@if (store.mensagemDeErro(); as mensagem) {
<ui-alert variant="danger" heading="Não foi possível carregar os perfis">
  {{ mensagem }}
  <div>
    <button type="button" class="btn btn--secondary btn--sm" (click)="store.recarregar()">
      Tentar novamente
    </button>
  </div>
</ui-alert>
} @if (edicao.erroDaAcao()) {
<ui-alert variant="danger" heading="Não foi possível concluir">{{ edicao.erroDaAcao() }}</ui-alert>
}

<cfg-perfis-lista
  [perfis]="store.itens()"
  [carregando]="store.carregando()"
  [erro]="store.mensagemDeErro()"
  [gravando]="edicao.gravando()"
  [temAnterior]="store.anterior() !== null"
  [temProximo]="store.proximo() !== null"
  (editar)="edicao.abrirEdicao($event)"
  (alternarAtivacao)="edicao.alternarAtivacao($event)"
  (anterior)="store.paginaAnterior()"
  (proximo)="store.proximaPagina()"
/>
<cfg-perfil-formulario
  [(aberto)]="edicao.formAberto"
  [form]="edicao.form"
  [emEdicao]="edicao.emEdicao() !== null"
  [salvando]="edicao.salvando()"
  [criacaoEmAberto]="edicao.criacaoEmAberto()"
  [erro]="edicao.erroDoForm()"
  [catalogo]="store.catalogo()"
  [erroDoCatalogo]="store.erroDoCatalogo()"
  [marcadas]="permissoesMarcadas()"
  (salvar)="edicao.aoEnviar()"
  (alternar)="edicao.alternar($event)"
  (recarregarCatalogo)="store.carregarCatalogo()"
/>
