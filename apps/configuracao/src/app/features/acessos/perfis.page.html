<div class="page-header">
  <div class="page-header__content">
    <h1 class="page-header__title">Perfis de acesso</h1>
    <p class="page-header__desc">
      Conjuntos nomeados de permissões. Cada mudança é uma versão nova, com documento instituidor e aprovação.
    </p>
  </div>
  @if (podeCriar()) {
    <div class="page-header__actions">
      <button
        type="button"
        class="btn btn--primary"
        [id]="idDoCadastro"
        [disabled]="escrita.gravando()"
        (click)="criar()"
      >
        Novo perfil
      </button>
    </div>
  }
</div>

<ui-falha-de-leitura titulo="Não foi possível carregar os perfis" [leitura]="leitura" />
<cfg-recusa-da-leitura naoEncontrado="Lista de perfis não encontrada" [recusa]="store.recusa()">
  <a routerLink="/">Ir para o início</a>.
</cfg-recusa-da-leitura>
@if (escrita.erroDaAcao()) {
<ui-alert variant="danger" heading="Não foi possível concluir">{{ escrita.erroDaAcao() }}</ui-alert>
}

<cfg-perfis-lista
  [perfis]="store.itens()"
  [carregando]="store.carregando()"
  [erro]="store.mensagemDeErro()"
  [gravando]="escrita.gravando()"
  [temAnterior]="store.anterior() !== null"
  [temProximo]="store.proximo() !== null"
  (anterior)="store.paginaAnterior()"
  (proximo)="store.proximaPagina()"
/>
<cfg-perfil-formulario />
