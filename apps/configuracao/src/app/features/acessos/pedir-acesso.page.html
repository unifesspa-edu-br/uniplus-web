<ui-page-header
  heading="Pedir acesso"
  description="O pedido passa pela aprovação da gestão de acessos e, quando o perfil inclui dado pessoal ou sensível, também pela do Representante do controlador."
/>

<cfg-pedir-acesso-formulario
  [form]="edicao.form"
  [enviando]="edicao.enviando()"
  [aguardandoConfirmacao]="edicao.aguardandoConfirmacao()"
  [faseDoEnvio]="edicao.faseDoEnvio()"
  [erro]="edicao.erro()"
  (enviar)="edicao.enviar()"
>
  <cfg-pedir-acesso-beneficiario [form]="edicao.form" [paraQuem]="edicao.paraQuem()" />
  <cfg-pedir-acesso-perfil
    [form]="edicao.form"
    [perfis]="edicao.perfis()"
    [leitura]="edicao.leituraDosPerfis"
    [recusa]="edicao.recusaDosPerfis()"
    [perfilSelecionado]="edicao.perfilSelecionado()"
    [unidades]="edicao.unidades()"
    [exigeUnidade]="edicao.exigeUnidade()"
  />
  <cfg-pedir-acesso-motivo
    [form]="edicao.form"
    [exigeDocumento]="edicao.exigeDocumento()"
    [hoje]="edicao.hoje()"
    [mensagemDoPrazo]="edicao.mensagemDoPrazo"
  />
  <cfg-pedido-documento-formulario
    [exigeDocumento]="edicao.exigeDocumento()"
    [desabilitado]="edicao.enviando() || edicao.aguardandoConfirmacao()"
    [erroDoDocumento]="edicao.erroDoDocumento()"
    [(arquivo)]="edicao.arquivo"
  />
</cfg-pedir-acesso-formulario>
