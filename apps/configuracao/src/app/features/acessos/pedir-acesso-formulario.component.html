<form class="panel form-drawer__form" [formGroup]="form()" (ngSubmit)="aoEnviar()" novalidate>
  <fieldset
    class="form-drawer__campos"
    role="none"
    [disabled]="enviando() || aguardandoConfirmacao()"
  >
    <ng-content />
  </fieldset>

  <p role="status" [class.sr-only]="faseDoEnvio() === null">
    {{ faseDoEnvio() ?? (enviando() ? 'Enviando pedido…' : '') }}
  </p>

  <div class="form-drawer__footer">
    <a
      class="btn btn--tertiary btn--rect"
      [routerLink]="enviando() ? null : '/acessos/pedidos'"
      [attr.aria-disabled]="enviando() ? 'true' : null"
      (click)="aoClicar($event)"
      >Cancelar</a
    >
    <button
      type="submit"
      class="btn btn--primary"
      [attr.aria-disabled]="enviando() ? 'true' : null"
      [attr.aria-busy]="enviando() ? 'true' : null"
      (click)="aoClicar($event)"
    >
      @if (enviando()) {
        <ui-spinner spinnerSize="sm" />
      }
      {{ enviando() ? 'Enviando…' : 'Enviar pedido' }}
    </button>
  </div>
</form>
