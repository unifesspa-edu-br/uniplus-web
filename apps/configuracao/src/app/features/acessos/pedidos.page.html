<div class="page-header">
  <div class="page-header__content">
    <h1 class="page-header__title">{{ texto().titulo }}</h1>
    <p class="page-header__desc">{{ texto().descricao }}</p>
  </div>
  @if (fila() === 'meus') {
  <div class="page-header__actions">
    <a class="btn btn--primary" routerLink="/acessos/pedidos/novo">Pedir acesso</a>
  </div>
  }
</div>

@if (store.mensagemDeErro(); as mensagem) {
<ui-alert variant="danger" heading="Não foi possível carregar os pedidos">
  {{ mensagem }}
  <div>
    <button type="button" class="btn btn--secondary btn--sm" (click)="recarregar()">
      Tentar novamente
    </button>
  </div>
</ui-alert>
}
<cfg-pedidos-lista
  [pedidos]="store.itens()"
  [nomesDosEscopos]="nomesDosEscopos()"
  [carregando]="store.carregando()"
  [erro]="store.mensagemDeErro()"
  [situacao]="store.situacao()"
  [titulo]="texto().titulo"
  [vazio]="texto().vazio"
  [filtraPorSituacao]="filtraPorSituacao()"
  [origem]="origemDoLink()"
  [temAnterior]="store.anterior() !== null"
  [temProximo]="store.proximo() !== null"
  (filtrar)="store.filtrarPor($event)"
  (abrir)="abrir($event)"
  (anterior)="store.paginaAnterior()"
  (proximo)="store.proximaPagina()"
/>
