<div class="page-header">
  <div class="page-header__content">
    <h1 class="page-header__title">Concessões de acesso</h1>
    <p class="page-header__desc">
      Quem tem acesso a quê, a trilha de cada concessão e a revogação, que tem efeito imediato.
    </p>
  </div>
</div>

@if (store.mensagemDeErro(); as mensagem) {
<ui-alerta-nova-tentativa
  titulo="Não foi possível carregar as concessões"
  [mensagem]="mensagem"
  [pendente]="store.carregando()"
  [indisponivel]="revogacao.gravando()"
  [fase]="novaTentativa.fase()"
  (tentar)="tentarNovamente()"
/>
}

<cfg-concessoes-lista
  [concessoes]="store.itens()"
  [carregando]="store.carregando()"
  [gravando]="revogacao.gravando()"
  [erro]="store.mensagemDeErro()"
  [situacao]="store.situacao()"
  [nomeDoEscopo]="escopo.nome"
  [temAnterior]="store.anterior() !== null"
  [temProximo]="store.proximo() !== null"
  (filtrar)="store.filtrarPor($event)"
  (verTrilha)="abrirTrilha($event)"
  (revogar)="revogar($event)"
  (anterior)="store.paginaAnterior()"
  (proximo)="store.proximaPagina()"
/>

<cfg-concessao-trilha
  [(aberto)]="trilhaAberta"
  [carregando]="store.carregandoTrilha()"
  [erro]="store.erroDaTrilha()"
  [eventos]="store.trilha()"
/>

<cfg-revogar-concessao-dialog
  [(visible)]="revogacao.revogando"
  [concessao]="revogacao.concessaoARevogar()"
  [escopoDaConcessao]="escopoDaRevogacao()"
  [erro]="revogacao.erroDaRevogacao()"
  [enviando]="revogacao.enviando()"
  [email]="revogacao.email"
  [motivo]="revogacao.motivo"
  [tentou]="revogacao.tentou()"
  (confirmado)="revogacao.confirmar()"
/>
