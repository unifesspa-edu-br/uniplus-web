@let documento = ato().documentoPrincipal;
@let anexos = ato().anexos;
<div class="arquivos" role="group" [attr.aria-label]="'Arquivos de ' + rotuloDoAto(ato())">
  <div class="arquivos__grupo">
    <p class="arquivos__titulo" [id]="prefixo + '-principal'">Documento principal</p>
    <ul class="arquivos__lista" role="list" [attr.aria-labelledby]="prefixo + '-principal'">
      <li>
        <ng-container
          *ngTemplateOutlet="
            arquivo;
            context: { $implicit: documento, tipo: 'o documento principal' }
          "
        />
      </li>
    </ul>
  </div>
  @if (anexos.length > 0) {
    <div class="arquivos__grupo">
      <p class="arquivos__titulo" [id]="prefixo + '-anexos'">Anexos ({{ anexos.length }})</p>
      <ul class="arquivos__lista" role="list" [attr.aria-labelledby]="prefixo + '-anexos'">
        @for (anexo of anexos; track anexo.documentoAPublicarId) {
          <li>
            <ng-container
              *ngTemplateOutlet="arquivo; context: { $implicit: anexo, tipo: 'o anexo' }"
            />
          </li>
        }
      </ul>
    </div>
  }
</div>

<ng-template #arquivo let-doc let-tipo="tipo">
  <button
    type="button"
    class="btn btn--tertiary btn--sm"
    [disabled]="abrindo() !== null"
    [attr.aria-busy]="abrindo() === doc.documentoAPublicarId || null"
    [attr.aria-label]="'Abrir ' + tipo + ' ' + nomeDoDocumento(doc) + ' (abre em nova aba)'"
    (click)="abrir.emit(doc.documentoAPublicarId)"
  >
    {{ abrindo() === doc.documentoAPublicarId ? 'Abrindo…' : nomeDoDocumento(doc) }}
  </button>
</ng-template>
