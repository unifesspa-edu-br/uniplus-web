<button
  #stepBarButton
  class="step-bar"
  type="button"
  [attr.aria-expanded]="stepsOverlayOpen()"
  aria-controls="steps-overlay"
  aria-label="Abrir lista de etapas"
  [style.--step-progress]="store.progress() + '%'"
  (click)="openStepsOverlay()"
>
  <div class="step-bar__info">
    <span class="step-bar__heading">Cadastro do processo seletivo</span
    ><span class="step-bar__meta">{{ store.currentMeta() }}</span>
  </div>
  <svg
    class="step-bar__chevron"
    width="20"
    height="20"
    viewBox="0 0 24 24"
    fill="none"
    stroke="currentColor"
    stroke-width="2.5"
  >
    <path d="M19 9l-7 7-7-7" />
  </svg>
</button>
<dialog
  #stepsOverlay
  class="steps-overlay"
  id="steps-overlay"
  aria-label="Etapas do cadastro"
  (cancel)="onStepsOverlayCancel($event)"
  (close)="onStepsOverlayClose()"
>
  <div class="steps-overlay__header">
    <button
      #stepsOverlayClose
      class="steps-overlay__close"
      type="button"
      aria-label="Fechar lista de etapas"
      (click)="closeStepsOverlay()"
    >
      <svg
        width="18"
        height="18"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2.5"
      >
        <path d="M18 6L6 18M6 6l12 12" />
      </svg>
    </button>
  </div>
  <sel-wizard-stepper (stepSelected)="closeStepsOverlay()"></sel-wizard-stepper>
</dialog>

<div class="wiz-shell">
  <nav class="wiz-nav" aria-label="Etapas do cadastro">
    <sel-wizard-stepper></sel-wizard-stepper>
  </nav>
  <div class="wiz-body">
    <div class="wiz-content" #wizContent (scroll)="onContentScroll($event)">
      <div aria-live="polite" aria-atomic="true">
        @if (store.stepError(); as errors) {
          <div class="step-error" role="alert">
            <i class="pi pi-exclamation-circle" aria-hidden="true"></i>
            <div class="step-error__content">
              <strong class="step-error__summary">
                @if (errors.length === 1) {
                  Há 1 erro no formulário
                } @else {
                  Há {{ errors.length }} erros no formulário
                }
              </strong>
              <ul class="step-error__list">
                @for (error of errors; track error) {
                  <li>{{ error }}</li>
                }
              </ul>
            </div>
          </div>
        }
        <section class="step-pane" [hidden]="store.currentStep() !== 0">
          <sel-step-01-tipo-processo #step01></sel-step-01-tipo-processo>
        </section>
        <section class="step-pane" [hidden]="store.currentStep() !== 1">
          <sel-step-02-identificacao #step02></sel-step-02-identificacao>
        </section>
        <section class="step-pane" [hidden]="store.currentStep() !== 2">
          <sel-step-03-modalidades #step03></sel-step-03-modalidades>
        </section>
        <section class="step-pane" [hidden]="store.currentStep() !== 3">
          <sel-step-04-vagas #step04></sel-step-04-vagas>
        </section>
        <section class="step-pane" [hidden]="store.currentStep() !== 4">
          <sel-step-05-etapas #step05></sel-step-05-etapas>
        </section>
        <section class="step-pane" [hidden]="store.currentStep() !== 5">
          <sel-step-06-formula #step06></sel-step-06-formula>
        </section>
        <section class="step-pane" [hidden]="store.currentStep() !== 6">
          <sel-step-07-bonus #step07></sel-step-07-bonus>
        </section>
        <section class="step-pane" [hidden]="store.currentStep() !== 7">
          <sel-step-08-desempate #step08></sel-step-08-desempate>
        </section>
        <section class="step-pane" [hidden]="store.currentStep() !== 8">
          <sel-step-09-eliminacao #step09></sel-step-09-eliminacao>
        </section>
        <section class="step-pane" [hidden]="store.currentStep() !== 9">
          <sel-step-10-documentos #step10></sel-step-10-documentos>
        </section>
        <section class="step-pane" [hidden]="store.currentStep() !== 10">
          <sel-step-11-polos #step11></sel-step-11-polos>
        </section>
        <section class="step-pane" [hidden]="store.currentStep() !== 11">
          <sel-step-12-atendimento #step12></sel-step-12-atendimento>
        </section>
        <section class="step-pane" [hidden]="store.currentStep() !== 12">
          <sel-step-13-revisao #step13></sel-step-13-revisao>
        </section>
      </div>
    </div>
    <div class="wiz-footer">
      <button
        class="btn btn--tertiary"
        type="button"
        [disabled]="store.salvando()"
        [hidden]="store.isFirst()"
        (click)="previous()"
      >
        <svg
          class="btn__icon"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2.5"
        >
          <path d="M19 12H5M12 19l-7-7 7-7" /></svg
        >Anterior</button
      ><button
        class="btn btn--primary"
        type="button"
        [attr.aria-busy]="store.salvando() || null"
        [disabled]="store.salvando()"
        (click)="nextOrPublish()"
      >
        @if (store.salvando()) {
          Salvando…
        } @else {
          {{ store.isLast() ? 'Publicar' : 'Próximo' }}
        }
        @if (!store.isLast() && !store.salvando()) {
          <svg
            class="btn__icon"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2.5"
          >
            <path d="M5 12h14M12 5l7 7-7 7" />
          </svg>
        }
      </button>
    </div>
    @if (publicationMessage()) {
      <p class="publication-message" role="status">{{ publicationMessage() }}</p>
    }
  </div>
</div>
<button
  class="uni-back-to-top"
  aria-label="Voltar ao topo da página"
  type="button"
  [hidden]="!showBackToTop()"
  (click)="scrollToTop()"
>
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
    <path d="M18 15l-6-6-6 6" />
  </svg>
</button>
