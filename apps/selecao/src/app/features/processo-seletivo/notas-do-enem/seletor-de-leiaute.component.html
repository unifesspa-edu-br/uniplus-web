@let leiautes = catalogo();
<ui-falha-de-leitura titulo="Não foi possível carregar os leiautes" [leitura]="leitura()" />
@switch (leiautes.estado) {
  @case ('lendo') {
    <p class="notas__lendo" [uiIndicadorDaLeitura]="leitura()">
      <ui-spinner spinnerSize="sm" [decorativo]="true" />
      Carregando os leiautes…
    </p>
  }
  @case ('lido') {
    @if (leiautes.dados.length === 0) {
      <ui-alert variant="warning" heading="Nenhum leiaute disponível">
        Nenhum leiaute ativo no catálogo. Fale com a equipe técnica.
      </ui-alert>
    } @else if (unico() === null) {
      <div class="field notas__campo" [class.is-error]="erro() !== null">
        <label class="field__label is-required" [for]="idDoCampo()">{{ rotulo() }}</label>
        <select
          #campo
          class="select"
          [id]="idDoCampo()"
          [formControl]="controle()"
          [attr.aria-invalid]="erro() !== null ? 'true' : null"
          [attr.aria-describedby]="erro() !== null ? idDoCampo() + '-erro' : null"
        >
          <option value="" disabled>Selecione o leiaute</option>
          @for (leiaute of leiautes.dados; track chaveDoLeiaute(leiaute)) {
            <option [value]="chaveDoLeiaute(leiaute)">{{ rotuloDoLeiaute(leiaute) }}</option>
          }
        </select>
        @if (erro(); as mensagem) {
          <span class="field__error" [id]="idDoCampo() + '-erro'">{{ mensagem }}</span>
        }
      </div>
    }
  }
}
