<p class="step-subtitle">Fórmula de agregação aplicada à nota final + regra de precisão decimal.</p>
<div class="step-card">
  <div class="form-field">
    <label class="label" for="f-agregacao">Agregação</label
    ><select
      class="input"
      id="f-agregacao"
      [class.is-invalid]="invalidFields().has('agregacao')"
      [value]="store.draft().formula.agregacao"
      (change)="store.patchObjectSection('formula', { agregacao: $any($event.target).value })"
    >
      <option value="">— escolher —</option>
      <option value="MEDIA_PONDERADA">Média Ponderada — Σ(nota×peso) / Σ pesos</option>
      <option value="SOMA_PONDERADA_COM_FATOR">
        Soma Ponderada com Fator — Σ(nota×peso) / fator
      </option>
      <option value="MEDIA_SIMPLES">Média Simples — Σ nota / N etapas</option>
      <option value="MEDIA_PONDERADA_ENEM">
        Média Ponderada ENEM — pesos por área + grupo de curso
      </option>
    </select>
  </div>
  <div class="form-field" style="margin-top: var(--space-4); max-width: 280px">
    <label class="label" for="f-precisao">Precisão</label
    ><select
      class="input"
      id="f-precisao"
      [class.is-invalid]="invalidFields().has('precisao')"
      [value]="store.draft().formula.precisao"
      (change)="store.patchObjectSection('formula', { precisao: $any($event.target).value })"
    >
      <option value="">— escolher —</option>
      <option value="TRUNCAR_2_CASAS">Truncar 2 casas decimais (PSIQ)</option>
      <option value="ARREDONDAR_PARA_CIMA_2_CASAS_SE_3A_GTE_5">
        Arredondar para cima 2 casas se 3ª casa ≥ 5 (PSE, PS Convênios)
      </option>
    </select>
  </div>
</div>
<div class="formula-preview">
  <p class="formula-preview__label">Preview da fórmula</p>
  <p class="formula-preview__text">{{ preview() }}</p>
</div>
