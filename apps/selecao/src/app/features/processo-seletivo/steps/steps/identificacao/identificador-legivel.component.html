  <label class="label" for="f-identificador">Identificador legível</label>
  <input
    class="input"
    id="f-identificador"
    autocomplete="off"
    spellcheck="false"
    placeholder="medicina-2027"
    aria-required="true"
    [formControl]="controle()"
    [attr.aria-describedby]="
      gravacao.erroDoIdentificador() ? 'f-identificador-erro f-identificador-hint' : 'f-identificador-hint'
    "
    [attr.aria-invalid]="invalido() || null"
    [class.is-invalid]="invalido()"
  />
  @if (gravacao.erroDoIdentificador(); as erro) {
    <p class="field__erro" id="f-identificador-erro" role="alert">{{ erro }}</p>
  }
  <p class="field__hint" id="f-identificador-hint">
    É o endereço público do certame no portal. Use letras minúsculas sem acento, dígitos e
    hífens, de 3 a 64 caracteres (ex.: medicina-2027). Pode ser trocado enquanto o processo for
    rascunho; depois de publicado, não muda mais.
  </p>
