<summary>Adicionar ofertas ao quadro</summary>

<div class="form-field vagas-escolha__filtro">
  <label class="label" for="f-filtro-oferta">Filtrar por curso, unidade ou turno</label>
  <input
    class="input"
    id="f-filtro-oferta"
    type="search"
    [ngModel]="quadro.filtroDeOferta()"
    (ngModelChange)="quadro.filtroDeOferta.set($event)"
    [disabled]="!store.aceitaEdicao()"
  />
</div>

<label class="check-item">
  <input
    type="checkbox"
    [checked]="
      quadro.ofertasMarcadas().size === quadro.ofertasParaEscolher().length &&
      quadro.ofertasParaEscolher().length > 0
    "
    [disabled]="!store.aceitaEdicao() || quadro.ofertasParaEscolher().length === 0"
    (change)="quadro.marcarTodasAsOfertas($any($event.target).checked)"
  />
  <span>Marcar todas as {{ quadro.ofertasParaEscolher().length }} ofertas listadas</span>
</label>

<div class="checkbox-grid vagas-escolha__lista">
  @for (oferta of quadro.ofertasParaEscolher(); track oferta.id) {
    <label class="check-item vagas-escolha__item">
      <input
        type="checkbox"
        [checked]="quadro.ofertaMarcada(oferta.id)"
        [disabled]="!store.aceitaEdicao()"
        (change)="quadro.alternarOfertaMarcada(oferta.id)"
      />
      <span>
        {{ quadro.nomeDaOferta(oferta.id) }}
        <span class="vagas-oferta__detalhe">{{ quadro.detalheDaOferta(oferta.id) }}</span>
      </span>
    </label>
  } @empty {
    <p class="field__hint">Nenhuma oferta corresponde ao filtro.</p>
  }
</div>

<button
  class="btn btn--outline btn--sm"
  type="button"
  (click)="quadro.adicionarOfertasMarcadas()"
  [disabled]="!store.aceitaEdicao() || quadro.ofertasMarcadas().size === 0"
>
  @if (quadro.ofertasMarcadas().size === 0) {
    Adicionar ao quadro
  } @else {
    Adicionar {{ quadro.ofertasMarcadas().size }} ao quadro
  }
</button>
