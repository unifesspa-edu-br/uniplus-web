<summary>Adicionar ofertas ao quadro</summary>

<div class="form-field vagas-escolha__filtro">
  <label class="label" for="f-filtro-oferta">Filtrar por curso, unidade ou turno</label>
  <input
    class="input"
    id="f-filtro-oferta"
    type="search"
    [ngModel]="estado.filtroDeOferta()"
    (ngModelChange)="estado.filtroDeOferta.set($event)"
    [disabled]="!store.aceitaEdicao()"
  />
</div>

<label class="check-item">
  <input
    type="checkbox"
    [checked]="
      estado.ofertasMarcadas().size === estado.ofertasParaEscolher().length &&
      estado.ofertasParaEscolher().length > 0
    "
    [disabled]="!store.aceitaEdicao() || estado.ofertasParaEscolher().length === 0"
    (change)="marcarTodas($any($event.target).checked)"
  />
  <span>Marcar todas as {{ estado.ofertasParaEscolher().length }} ofertas listadas</span>
</label>

<div class="checkbox-grid vagas-escolha__lista">
  @for (oferta of estado.ofertasParaEscolher(); track oferta.id) {
    <label class="check-item vagas-escolha__item">
      <input
        type="checkbox"
        [checked]="estado.ofertasMarcadas().has(oferta.id)"
        [disabled]="!store.aceitaEdicao()"
        (change)="alternarMarcada(oferta.id)"
      />
      <span>
        {{ catalogos.nomeDaOfertaOuSemNome(oferta.id) }}
        <span class="vagas-oferta__detalhe">{{ catalogos.detalheDaOfertaOuVazio(oferta.id) }}</span>
      </span>
    </label>
  } @empty {
    <p class="field__hint">Nenhuma oferta corresponde ao filtro.</p>
  }
</div>

<button
  class="btn btn--outline btn--sm"
  type="button"
  (click)="adicionar()"
  [disabled]="!store.aceitaEdicao() || estado.ofertasMarcadas().size === 0"
>
  @if (estado.ofertasMarcadas().size === 0) {
    Adicionar ao quadro
  } @else {
    Adicionar {{ estado.ofertasMarcadas().size }} ao quadro
  }
</button>
