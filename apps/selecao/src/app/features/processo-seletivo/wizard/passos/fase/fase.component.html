@if (fasesNoSeletor().length === 0) {
  <p class="field__hint">
    Este processo ainda não tem cronograma. Defina as fases no passo Cronograma antes de configurar
    o que cada uma publica, julga e exige.
  </p>
} @else if (formulario(); as form) {
  <form [formGroup]="form">
    @if (recusasDaConfiguracao().length > 0) {
      <sel-recusas-do-campo
        class="step-card"
        [attr.id]="idDaFase('recusas')"
        tabindex="-1"
        [recusas]="recusasDaConfiguracao()"
      />
    }

    <!-- Publicações -->
    <sel-publicacoes-da-fase class="step-card"></sel-publicacoes-da-fase>

    <!-- Conclusão do ciclo recursal e parecer -->
    <sel-ciclo-recursal-da-fase class="step-card"></sel-ciclo-recursal-da-fase>

    <sel-decisoes-da-fase class="step-card"></sel-decisoes-da-fase>

    <!-- Regra de recurso -->
    <sel-regra-de-recurso-da-fase class="step-card" [formulario]="form" />

    <!-- Bancas requeridas -->
    <sel-bancas-da-fase class="step-card"></sel-bancas-da-fase>

    <!-- Exigências documentais -->
    <sel-documentos-da-fase class="step-card"></sel-documentos-da-fase>
  </form>
}
