<label class="label" [attr.for]="idDaFase('doc-alcance-' + documentoId())"
  >Exigido em</label
>
<!--
Alcance entre fases, que é outro eixo do "Coletado em" ao lado: este diz em
QUAIS fases o documento é exigido; aquele, em que ponto DESTA fase ele é
coletado — e a resposta do segundo continua sendo por fase mesmo quando o
primeiro diz "todas".
                              -->
<select
  class="select"
  [attr.id]="idDaFase('doc-alcance-' + documentoId())"
  [disabled]="!store.aceitaEdicao()"
  (change)="
    escolherAlcanceDoDocumento(documentoId(), $any($event.target).value)
  "
>
  <option value="fase" [selected]="!exigencias.valeEmTodasAsFases(documentoId())">
    Só em {{ nomeDaFaseAberta() }}
  </option>
  <option value="todas" [selected]="exigencias.valeEmTodasAsFases(documentoId())">
    Todas as fases do edital
  </option>
</select>
