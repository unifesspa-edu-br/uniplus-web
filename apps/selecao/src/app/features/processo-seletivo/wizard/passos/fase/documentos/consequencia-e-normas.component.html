<div class="form-field">
  <label class="label" [attr.for]="idDaConsequencia()">Se não for entregue</label>
  <select
    class="select"
    [id]="idDaConsequencia()"
    [disabled]="desabilitado()"
    [attr.aria-invalid]="recusasDaConsequencia().length ? 'true' : null"
    [attr.aria-describedby]="
      recusasDaConsequencia().length ? idDaConsequencia() + '-recusas' : null
    "
    (change)="consequenciaChange.emit($any($event.target).value)"
  >
    @for (opcao of opcoes(); track opcao.valor) {
      <option [value]="opcao.valor" [selected]="opcao.valor === consequencia()">
        {{ rotuloDaConsequencia(opcao.valor, obrigatorio()) }}
      </option>
    }
  </select>
  <ui-recusa-do-campo [id]="idDaConsequencia() + '-recusas'" [recusas]="recusasDaConsequencia()" />
  <ng-content select="[aviso]"></ng-content>
</div>
<div
  role="group"
  tabindex="-1"
  [id]="idDasNormas() + '-grupo'"
  aria-label="Normas"
  [attr.aria-describedby]="recusasDasNormas().length ? idDasNormas() + '-recusas' : null"
>
  <ui-recusa-do-campo [id]="idDasNormas() + '-recusas'" [recusas]="recusasDasNormas()" />
  <ui-normas-do-documento
    disposicao="na-grade"
    [bases]="bases()"
    [idBase]="idDasNormas()"
    [disabled]="desabilitado()"
    [minimo]="1"
    [textos]="textos()"
    [referenciaObrigatoria]="false"
    [maximoReferencia]="null"
    [maximoObservacao]="null"
    (basesChange)="basesChange.emit($event)"
  >
    <ng-content></ng-content>
  </ui-normas-do-documento>
</div>
