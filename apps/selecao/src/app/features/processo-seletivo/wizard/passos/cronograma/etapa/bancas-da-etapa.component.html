@let etapa = grupo();

<h4 class="form-section__title">Quem julga esta etapa</h4>
@if (catalogoDeBancas.bancas().length > 0) {
  <div class="checkbox-grid">
    @for (banca of catalogoDeBancas.bancas(); track banca.id) {
      <label class="checkbox">
        <input
          type="checkbox"
          [checked]="edicao.bancasDaEtapa(etapa).some((declarada) => declarada.tipoBancaId === banca.id)"
          [disabled]="!edicaoLiberada()"
          (change)="edicao.alternarBancaDaEtapa(etapa, banca.id, $any($event.target).checked)"
        />
        <span class="checkbox__box" aria-hidden="true"></span>
        {{ banca.nome }}
      </label>
    }
  </div>

  @for (banca of escolhidas(); track banca.tipoBancaId) {
    <fieldset class="form-field">
      <legend class="label">Deliberação da banca {{ banca.nome }}</legend>
      <sel-regra-de-deliberacao
        [regra]="banca.regra"
        [idBase]="'etapa-' + indiceDaEtapa() + '-banca-' + banca.tipoBancaId"
        [desabilitada]="!edicaoLiberada()"
        [erros]="banca.erros"
        (regraChange)="edicao.declararRegraDaBancaDaEtapa(etapa, banca.tipoBancaId, $event)"
      />
    </fieldset>
  }
} @else {
  <p class="field__hint">Nenhum tipo de banca no cadastro.</p>
}
