@let etapa = grupo();

<h4 class="form-section__title">Quem julga esta etapa</h4>
@if (catalogos.bancas().length > 0) {
  <div class="checkbox-grid">
    @for (banca of catalogos.bancas(); track banca.id) {
      <label class="checkbox">
        <input
          type="checkbox"
          [checked]="edicao.bancasDaEtapa(etapa).includes(banca.id)"
          [disabled]="!edicaoLiberada()"
          (change)="edicao.alternarBancaDaEtapa(etapa, banca.id, $any($event.target).checked)"
        />
        <span class="checkbox__box" aria-hidden="true"></span>
        {{ banca.nome }}
      </label>
    }
  </div>
} @else {
  <p class="field__hint">Nenhum tipo de banca no cadastro.</p>
}
