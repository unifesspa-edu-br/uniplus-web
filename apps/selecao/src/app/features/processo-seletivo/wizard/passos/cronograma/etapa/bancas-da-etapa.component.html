<h4 class="form-section__title" [id]="'cr-etapa-bancas-titulo-' + indiceDaEtapa()">
  Quem julga esta etapa
</h4>
<ng-template #detalhe let-banca>
  <fieldset class="form-field">
    <legend class="label">Deliberação da banca</legend>
    <sel-regra-de-deliberacao
      [regra]="banca.regraDeDeliberacao"
      [idBase]="'etapa-' + indiceDaEtapa() + '-banca-' + banca.identificadorLocal"
      [desabilitada]="!cronograma.edicaoLiberada()"
      [erros]="errosDasRegras().get(banca.identificadorLocal) ?? {}"
      [recusas]="recusasDasRegras().get(banca.identificadorLocal) ?? {}"
      (regraChange)="alterarRegra(banca, $event)"
    />
  </fieldset>
</ng-template>
<div
  role="group"
  [attr.aria-labelledby]="'cr-etapa-bancas-titulo-' + indiceDaEtapa()"
  [attr.aria-describedby]="
    recusas.recusasDoCampo(grupo(), 'bancas').length
      ? 'cr-etapa-bancas-erro-' + indiceDaEtapa()
      : null
  "
>
  <sel-lista-de-bancas
    [idBase]="'cr-etapa-bancas-' + indiceDaEtapa()"
    [idRecusas]="'cr-etapa-bancas-erro-' + indiceDaEtapa()"
    [bancas]="edicao.bancasDaEtapa(grupo())"
    [tipos]="tipos()"
    [recusas]="recusas.recusasDoCampo(grupo(), 'bancas')"
    [edicaoLiberada]="cronograma.edicaoLiberada()"
    [detalhe]="detalhe"
    (bancasChange)="edicao.escreverBancas(grupo(), $event)"
  />
</div>
