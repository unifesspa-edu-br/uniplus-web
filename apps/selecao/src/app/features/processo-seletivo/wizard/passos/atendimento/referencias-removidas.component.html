@for (item of itens(); track item.id) {
  <div class="check-item">
    <span
      >{{ item.nome }} <span class="tag tag--warning">{{ situacao() }}</span></span
    >
    <button
      class="btn btn--tertiary btn--sm"
      type="button"
      [id]="prefixoDoId() + '-' + $index"
      [disabled]="desabilitado()"
      [attr.aria-label]="'Remover definitivamente ' + item.nome"
      (click)="retirar.emit(item.id)"
    >
      Remover
    </button>
  </div>
}
