<h2 class="form-section__title">Etapas sem a fase que as agrupa</h2>
<p class="field__hint">
  Estas etapas pontuadas continuam no processo, mas nenhuma fase da linha do tempo as agrupa.
  Acrescente a fase de avaliação acima para recebê-las de volta, ou remova-as aqui.
</p>
<ul>
  @for (orfa of leitura.etapasOrfas(); track orfa.indice) {
    <li>
      {{ orfa.rotulo }}
      <button
        class="btn btn--tertiary"
        type="button"
        (click)="cronograma.removerEtapa(orfa.indice)"
        [disabled]="!edicaoLiberada()"
        [attr.aria-label]="'Remover ' + orfa.rotulo"
      >
        Remover
      </button>
    </li>
  }
</ul>
<button
  class="btn btn--secondary"
  type="button"
  (click)="cronograma.removerTodasAsEtapas()"
  [disabled]="!edicaoLiberada()"
>
  Remover todas as etapas
</button>
