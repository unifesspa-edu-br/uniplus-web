<fieldset class="field">
  <legend class="field__label">{{ legendaCompleta() }}</legend>
  <div class="form-grid">
    <div class="form-field">
      <label class="label" [attr.for]="ids().valor">Valor</label>
      <input
        class="input"
        type="text"
        inputmode="decimal"
        [attr.id]="ids().valor"
        [value]="valor()"
        [disabled]="desabilitado()"
        [attr.aria-required]="obrigatorio() ? 'true' : null"
        [attr.aria-invalid]="valorInvalido()"
        [attr.aria-describedby]="descritoPeloValor()"
        (input)="digitado($event)"
      />
    </div>
    <div class="form-field">
      <label class="label" [attr.for]="ids().unidade">Unidade</label>
      <select
        class="select"
        [attr.id]="ids().unidade"
        [disabled]="unidadeDesabilitada()"
        [attr.aria-required]="obrigatorio() ? 'true' : null"
        [attr.aria-invalid]="unidadeInvalida()"
        [attr.aria-describedby]="descritaPelaUnidade()"
        (change)="escolhida($event)"
      >
        <option value="" [selected]="unidade() === ''">{{ opcaoEmBranco() }}</option>
        @for (opcao of opcoes(); track opcao.codigo) {
          <option [value]="opcao.codigo" [selected]="opcao.codigo === unidade()">
            {{ opcao.texto }}
          </option>
        }
      </select>
    </div>
  </div>
  @if (semUnidadeParaEscolher()) {
    <p
      class="field__hint"
      tabindex="-1"
      [attr.id]="ids().situacao"
      [attr.aria-describedby]="descritaPelaSituacao()"
    >
      {{ textoDaSituacao() }}
    </p>
  }
  @if (recusasDoValor().length > 0) {
    <sel-recusas-do-campo
      [attr.id]="ids().recusasDoValor"
      tabindex="-1"
      [recusas]="recusasDoValor()"
    />
  }
  @if (recusasDaUnidade().length > 0) {
    <sel-recusas-do-campo
      [attr.id]="ids().recusasDaUnidade"
      tabindex="-1"
      [recusas]="recusasDaUnidade()"
    />
  }
  @if (retiravel()) {
    <button
      class="btn btn--tertiary"
      type="button"
      [attr.id]="ids().retirar"
      [disabled]="desabilitado()"
      (click)="retirar.emit()"
    >
      {{ textoDoBotaoDeRetirar() }}
    </button>
  }
</fieldset>
